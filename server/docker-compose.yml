version: '3.8'

services:
  chatterbox-tts:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: chatterbox-tts-server:latest
    container_name: chatterbox-tts
    ports:
      - "8000:8000"
    environment:
      # Device configuration
      - DEVICE=cuda
      # Model loading options
      - LOAD_ENGLISH_MODEL=true
      - LOAD_MULTILINGUAL_MODEL=true
      # Speaker cache size
      - MAX_SPEAKER_CACHE=100
      # HuggingFace token (optional, for private models)
      - HF_TOKEN=${HF_TOKEN:-}
      # Number of threads for CPU operations
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      # Persist HuggingFace model cache
      - hf_cache:/app/.cache/huggingface
      # Optional: Mount custom audio prompts
      - ./audio_prompts:/app/audio_prompts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 300s

  # CPU-only version (uncomment to use instead of GPU version)
  # chatterbox-tts-cpu:
  #   build:
  #     context: ..
  #     dockerfile: server/Dockerfile.cpu
  #   image: chatterbox-tts-server-cpu:latest
  #   container_name: chatterbox-tts-cpu
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DEVICE=cpu
  #     - LOAD_ENGLISH_MODEL=true
  #     - LOAD_MULTILINGUAL_MODEL=false  # CPU is slow, maybe load only one
  #     - MAX_SPEAKER_CACHE=50
  #   volumes:
  #     - hf_cache:/app/.cache/huggingface
  #   restart: unless-stopped

volumes:
  hf_cache:
    name: chatterbox_hf_cache

